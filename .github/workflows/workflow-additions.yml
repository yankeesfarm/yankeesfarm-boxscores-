# Add these two steps to .github/workflows/daily-boxscores.yml,
# right after your existing "Run script" step (the one that runs
# dsl_fcl_boxscores.py) and before "Commit output".
#
# Also add this once, at repo level:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  WIX_PUSH_SECRET
#     Value: <same secret value as YANKEESFARM_PUSH_SECRET in Wix>

      - name: Build top performers
        run: python3 top_performers.py

      - name: Push top performers to Wix
        env:
          WIX_PUSH_SECRET: ${{ secrets.WIX_PUSH_SECRET }}
        run: python3 push_top_performers_to_wix.py
