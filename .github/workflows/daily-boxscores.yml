name: Daily DSL/FCL Box Scores

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET (adjust for DST: 13 UTC = 9am EDT, 14 UTC = 9am EST)
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run script
        run: python3 dsl_fcl_boxscores.py
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Daily DSL/FCL box scores $(date +%F)" || echo "Nothing to commit"
          git push
