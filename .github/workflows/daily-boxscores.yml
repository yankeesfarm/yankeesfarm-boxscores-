name: Daily Yankees Box Scores

on:
  schedule:
    - cron: '0 2 * * *'    # 10:00pm ET (EDT); add 1 hour to each in winter (EST)
    - cron: '45 3 * * *'   # 11:45pm ET (EDT) -- your original daily run
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run script
        run: python3 dsl_fcl_boxscores.py
      - name: Build top performers
        run: python3 top_performers.py
      - name: Push top performers to Wix
        env:
          WIX_PUSH_SECRET: ${{ secrets.WIX_PUSH_SECRET }}
        run: python3 push_top_performers_to_wix.py
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Daily Yankees box scores $(date +%F)" || echo "Nothing to commit"
          git push
