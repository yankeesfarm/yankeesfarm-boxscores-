name: Daily Yankees Box Scores

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET (13 UTC); switch to 14 in winter (EST)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run script
        run: python3 dsl_fcl_boxscores.py
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Daily Yankees box scores $(date +%F)" || echo "Nothing to commit"
          git push
