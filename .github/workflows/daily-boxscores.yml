name: Daily Yankees Box Scores

on:
  schedule:
    # GitHub Actions cron always runs in UTC and does not auto-adjust for
    # daylight saving. These times are correct for EDT (UTC-4), currently
    # in effect. Once EST (UTC-5) starts this fall, each cron below needs
    # to shift one hour later in UTC terms to keep hitting the same ET
    # clock times.

    # 7:00am ET, Tuesday through Sunday (Monday excluded -- no DSL/FCL
    # games that morning). 7am ET = 11:00 UTC, no day rollover, so the
    # UTC weekday list matches the ET weekday list directly.
    - cron: '0 11 * * 0,2,3,4,5,6'

    # 10:00pm ET, Tuesday through Sunday. 10pm ET = 2:00am UTC the NEXT
    # day, so each ET weekday's run actually fires on the following UTC
    # weekday. To land on ET Tue-Sun, the UTC firing days are every day
    # except Tuesday (i.e. Mon/Wed/Thu/Fri/Sat/Sun in UTC covers ET's
    # Sun/Tue/Wed/Thu/Fri/Sat -- Monday ET's 10pm run would fire UTC
    # Tuesday, which is excluded here on purpose, since Monday only gets
    # its own separate 2pm run below).
    - cron: '0 2 * * 0,1,3,4,5,6'

    # 2:00pm ET, Monday only -- the one day DSL/FCL teams play at a
    # different time. 2pm ET = 18:00 UTC, no rollover.
    - cron: '0 18 * * 1'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run script
        run: python3 dsl_fcl_boxscores.py
      - name: Build top performers
        run: python3 top_performers.py
      - name: Push top performers to Wix
        env:
          WIX_PUSH_SECRET: ${{ secrets.WIX_PUSH_SECRET }}
        run: python3 push_top_performers_to_wix.py
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Daily Yankees box scores $(date +%F)" || echo "Nothing to commit"
          git push
