name: Fetch Farm Stats (Analytics Feed)

# Runs fetch_farm_stats.py (MLB Stats API + FanGraphs enrichment via
# Playwright) and pushes the resulting data.json to the Wix analytics
# endpoint so the Farm Statistics page stays current.
#
# Playwright launches a real Chromium browser to load FanGraphs,
# bypassing the Cloudflare JS challenge that blocks plain HTTP requests
# from GitHub Actions IP ranges.
#
# Schedule matches daily-prospect-stats.yml: 7am and 10pm ET Tue-Sun,
# 2pm ET Monday only.

on:
  schedule:
    # 7:00am ET, Tuesday through Sunday  (11:00 UTC)
    - cron: '0 11 * * 0,2,3,4,5,6'
    # 10:00pm ET, Tuesday through Sunday  (02:00 UTC next day)
    - cron: '0 2 * * 0,1,3,4,5,6'
    # 2:00pm ET, Monday only  (18:00 UTC)
    - cron: '0 18 * * 1'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: playwright install chromium --with-deps

      - name: Build analytics data.json
        run: python3 fetch_farm_stats.py --season 2026 --out data/analytics/data.json

      - name: Push to Wix analytics endpoint
        env:
          WIX_ANALYTICS_ENDPOINT: ${{ secrets.WIX_ANALYTICS_ENDPOINT }}
          WIX_PUSH_SECRET: ${{ secrets.WIX_PUSH_SECRET }}
        run: |
          python3 push_to_wix.py \
            --file data/analytics/data.json \
            --period analytics \
            --endpoint-env WIX_ANALYTICS_ENDPOINT
