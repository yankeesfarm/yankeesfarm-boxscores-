name: Weekly Stats Report

on:
  schedule:
    # 11 PM ET on Sunday. Cron is UTC and does NOT auto-adjust for daylight saving:
    #   - EST (winter, roughly early Nov–early Mar): 11 PM ET = 4:00 AM UTC Monday -> '0 4 * * 1'
    #   - EDT (summer, roughly mid Mar–early Nov):    11 PM ET = 3:00 AM UTC Monday -> '0 3 * * 1'
    # This is set for EST. Flip to '0 3 * * 1' when EDT is in effect.
    - cron: '0 4 * * 1'
  workflow_dispatch:  # lets you trigger it manually to test

permissions:
  issues: write
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run weekly report script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 weekly_report.py
